<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP3 转 MP4 黑屏视频转换器 V5</title>
<style>
body{background:#111;color:#fff;font-family:Arial;margin:0}
.box{max-width:900px;margin:40px auto;padding:30px;background:#222;border-radius:16px}
button{padding:12px 20px;margin:8px}
#log{background:#000;padding:15px;min-height:120px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h1>MP3 → MP4 黑屏视频转换器 V5</h1>
<input id="files" type="file" accept=".mp3" multiple>
<button id="load">加载引擎</button>
<button id="start" disabled>开始转换</button>
<pre id="log">等待...</pre>
<div id="downloads"></div>
</div>

<script src="./ffmpeg/ffmpeg.min.js"></script>
<script>
let ffmpeg;
const log=document.getElementById("log");
const start=document.getElementById("start");

load.onclick=async()=>{
 try{
  log.textContent="加载本地 FFmpeg...";
  ffmpeg=FFmpeg.createFFmpeg({log:true,corePath:"./ffmpeg/ffmpeg-core.js"});
  await ffmpeg.load();
  start.disabled=false;
  log.textContent+="
加载成功";
 }catch(e){log.textContent="失败:
"+e;}
};

start.onclick=async()=>{
 for(const file of files.files){
  const name=file.name.replace(/\.mp3$/i,"");
  ffmpeg.FS("writeFile",file.name,new Uint8Array(await file.arrayBuffer()));
  await ffmpeg.run("-f","lavfi","-i","color=c=black:s=1920x1080:r=30","-i",file.name,"-c:v","libx264","-c:a","aac","-shortest",name+".mp4");
  const data=ffmpeg.FS("readFile",name+".mp4");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data.buffer],{type:"video/mp4"}));
  a.download=name+".mp4";
  a.textContent="下载 "+name+".mp4";
  downloads.appendChild(a);
 }
};
</script>
</body>
</html>
