<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MP3 转 MP4 黑屏视频转换器 V4.1</title>
<style>
body{background:#0b0b0b;color:white;font-family:Arial,"Microsoft YaHei"}
.box{max-width:900px;margin:40px auto;padding:30px;background:#181818;border-radius:18px}
button{padding:12px 20px;margin:8px}
#log{background:#000;padding:15px;min-height:120px;white-space:pre-wrap}
a{display:block;color:#6ea8ff;margin:8px}
</style>
</head>
<body>
<div class="box">
<h1>MP3 → MP4 黑屏转换器 V4.1</h1>
<p>本地浏览器处理，不上传音频。</p>
<input id="files" type="file" accept=".mp3" multiple>
<br>
<button id="load">加载引擎</button>
<button id="start" disabled>开始转换</button>
<div id="log">等待...</div>
<div id="downloads"></div>
</div>

<script type="module">
import { FFmpeg } from "./ffmpeg/index.js";
import { fetchFile, toBlobURL } from "./ffmpeg/utils.js";

const ffmpeg=new FFmpeg();
const log=document.querySelector("#log");
const start=document.querySelector("#start");

ffmpeg.on("log",({message})=>{
 log.textContent += "\\n"+message;
});

document.querySelector("#load").onclick=async()=>{
 try{
  log.textContent="加载本地 FFmpeg...";
  await ffmpeg.load({
   coreURL: await toBlobURL("./ffmpeg/ffmpeg-core.js","text/javascript"),
   wasmURL: await toBlobURL("./ffmpeg/ffmpeg-core.wasm","application/wasm")
  });
  start.disabled=false;
  log.textContent+="\\n引擎加载成功";
 }catch(e){
  log.textContent="加载失败:\\n"+e;
 }
};

start.onclick=async()=>{
 const files=[...document.querySelector("#files").files];
 for(const file of files){
  const name=file.name.replace(/\.mp3$/i,"");
  await ffmpeg.writeFile(file.name,await fetchFile(file));
  await ffmpeg.exec([
   "-f","lavfi","-i","color=c=black:s=1920x1080:r=30",
   "-i",file.name,
   "-c:v","libx264",
   "-c:a","aac",
   "-b:a","320k",
   "-pix_fmt","yuv420p",
   "-shortest",
   name+".mp4"
  ]);
  const data=await ffmpeg.readFile(name+".mp4");
  const url=URL.createObjectURL(new Blob([data.buffer],{type:"video/mp4"}));
  const a=document.createElement("a");
  a.href=url;
  a.download=name+".mp4";
  a.textContent="下载 "+name+".mp4";
  document.querySelector("#downloads").appendChild(a);
 }
};
</script>
</body>
</html>
