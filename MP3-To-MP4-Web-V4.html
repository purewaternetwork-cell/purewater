<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MP3 转 MP4 黑屏视频转换器 V4</title>
<style>
body{background:#0b0b0b;color:#fff;font-family:Arial,"Microsoft YaHei";margin:0}
.box{max-width:900px;margin:40px auto;background:#181818;padding:30px;border-radius:18px}
button{padding:12px 20px;margin:8px;border:0;border-radius:8px;cursor:pointer}
#log{background:#000;padding:15px;min-height:120px;white-space:pre-wrap}
a{display:block;margin:8px;color:#6ea8ff}
</style>
</head>
<body>
<div class="box">
<h1>MP3 → MP4 黑屏视频转换器 V4</h1>
<p>纯前端浏览器处理，音频不会上传服务器。</p>

<input id="files" type="file" accept=".mp3" multiple>
<br>
<button id="load">加载引擎</button>
<button id="start" disabled>开始转换</button>

<div id="log">等待加载...</div>
<div id="downloads"></div>
</div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile, toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

const ffmpeg = new FFmpeg();
const log=document.getElementById("log");
const start=document.getElementById("start");

ffmpeg.on("log", ({message})=>{
    log.textContent += "\\n"+message;
});

document.getElementById("load").onclick = async()=>{
    try{
        log.textContent="正在加载 FFmpeg...";
        await ffmpeg.load({
            coreURL: await toBlobURL(
                "./ffmpeg/ffmpeg-core.js",
                "text/javascript"
            ),
            wasmURL: await toBlobURL(
                "./ffmpeg/ffmpeg-core.wasm",
                "application/wasm"
            )
        });
        start.disabled=false;
        log.textContent+="\\nFFmpeg 加载成功";
    }catch(e){
        log.textContent="加载失败:\\n"+e;
    }
};

start.onclick = async()=>{
    const files=[...document.getElementById("files").files];

    for(const file of files){
        const name=file.name.replace(/\\.mp3$/i,"");

        log.textContent+="\\n转换:"+file.name;

        await ffmpeg.writeFile(
            file.name,
            await fetchFile(file)
        );

        await ffmpeg.exec([
            "-f","lavfi",
            "-i","color=c=black:s=1920x1080:r=30",
            "-i",file.name,
            "-c:v","libx264",
            "-pix_fmt","yuv420p",
            "-c:a","aac",
            "-b:a","320k",
            "-shortest",
            name+".mp4"
        ]);

        const data=await ffmpeg.readFile(name+".mp4");
        const url=URL.createObjectURL(
            new Blob([data.buffer],{type:"video/mp4"})
        );

        const a=document.createElement("a");
        a.href=url;
        a.download=name+".mp4";
        a.textContent="下载 "+name+".mp4";
        document.getElementById("downloads").appendChild(a);
    }

    log.textContent+="\\n全部完成";
};
</script>
</body>
</html>
