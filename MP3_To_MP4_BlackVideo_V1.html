<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP3 转 MP4 黑屏视频转换器</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#eee;padding:30px}
.box{max-width:800px;margin:auto;background:#222;padding:25px;border-radius:12px}
button{padding:10px 18px;margin:10px 0;cursor:pointer}
#log{white-space:pre-wrap;background:#000;padding:15px;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<h1>MP3 → MP4 黑屏视频转换器</h1>
<p>Chrome 浏览器测试版（ffmpeg.wasm CDN加载）</p>

<input id="files" type="file" accept=".mp3" multiple>
<br>
<button id="load">加载转换引擎</button>
<button id="convert" disabled>开始转换</button>

<div id="log">等待操作...</div>
<div id="output"></div>
</div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile, toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

const ffmpeg = new FFmpeg();
const log = document.getElementById("log");
const loadBtn = document.getElementById("load");
const convertBtn = document.getElementById("convert");
let loaded=false;

ffmpeg.on("log", ({message})=>{
    log.textContent += "\\n"+message;
});

loadBtn.onclick = async ()=>{
    try{
        log.textContent="正在加载 FFmpeg 引擎...";
        const baseURL="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";
        await ffmpeg.load({
            coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`,"text/javascript"),
            wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`,"application/wasm")
        });
        loaded=true;
        convertBtn.disabled=false;
        log.textContent+="\\nFFmpeg 加载成功";
    }catch(e){
        log.textContent="加载失败:\\n"+e;
    }
};

convertBtn.onclick = async ()=>{
    if(!loaded)return;
    const files=[...document.getElementById("files").files];
    if(!files.length){
        alert("请选择MP3文件");
        return;
    }

    const output=document.getElementById("output");
    output.innerHTML="";

    for(const file of files){
        const name=file.name.replace(/\.mp3$/i,"");
        log.textContent+="\\n转换: "+file.name;

        await ffmpeg.writeFile(file.name, await fetchFile(file));

        await ffmpeg.exec([
            "-f","lavfi",
            "-i","color=c=black:s=1920x1080:r=30",
            "-i",file.name,
            "-c:v","libx264",
            "-c:a","aac",
            "-b:a","320k",
            "-shortest",
            "-pix_fmt","yuv420p",
            `${name}.mp4`
        ]);

        const data=await ffmpeg.readFile(`${name}.mp4`);
        const url=URL.createObjectURL(new Blob([data.buffer],{type:"video/mp4"}));

        const a=document.createElement("a");
        a.href=url;
        a.download=`${name}.mp4`;
        a.textContent=`下载 ${name}.mp4`;
        a.style.display="block";
        output.appendChild(a);

        log.textContent+="\\n完成: "+name+".mp4";
    }
};
</script>
</body>
</html>
