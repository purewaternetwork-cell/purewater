<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MP3 转 MP4 黑屏视频批量转换器</title>
<style>
body{background:#111;color:#eee;font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px}
.card{background:#1d1d1d;padding:25px;border-radius:12px}
button{padding:12px 20px;border:0;border-radius:8px;background:#3b82f6;color:white;cursor:pointer}
li{margin:8px 0}
small{color:#aaa}
</style>
</head>
<body>
<div class="card">
<h1>MP3 → MP4 黑屏视频批量转换器</h1>
<p>单 HTML 文件方案（浏览器端 FFmpeg WASM）</p>

<input id="files" type="file" multiple accept=".mp3,audio/mpeg">
<br>
<button onclick="convert()">开始批量转换</button>

<p id="status">等待选择文件...</p>
<ul id="list"></ul>

<hr>
<small>
输出规格：1920×1080 / 30FPS / H264 / AAC / 黑色画面<br>
注意：浏览器转换大型文件会占用较多内存。
</small>
</div>

<script type="module">
import { FFmpeg } from "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile } from "https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js";

const ffmpeg = new FFmpeg();
let loaded=false;

async function init(){
 if(!loaded){
  document.getElementById("status").innerText="加载转换引擎...";
  await ffmpeg.load({
   coreURL:"https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js"
  });
  loaded=true;
 }
}

window.convert=async function(){
 const files=document.getElementById("files").files;
 if(!files.length){alert("请选择 MP3 文件");return;}

 await init();

 const list=document.getElementById("list");
 list.innerHTML="";

 for(let i=0;i<files.length;i++){
  const file=files[i];
  const name=file.name.replace(/\.mp3$/i,"");
  const input="input_"+i+".mp3";
  const output=name+".mp4";

  document.getElementById("status").innerText=`正在转换 ${i+1}/${files.length}`;

  await ffmpeg.writeFile(input,await fetchFile(file));

  await ffmpeg.exec([
   "-f","lavfi",
   "-i","color=c=black:s=1920x1080:r=30",
   "-i",input,
   "-c:v","libx264",
   "-pix_fmt","yuv420p",
   "-c:a","aac",
   "-b:a","320k",
   "-shortest",
   output
  ]);

  const data=await ffmpeg.readFile(output);
  const blob=new Blob([data.buffer],{type:"video/mp4"});
  const url=URL.createObjectURL(blob);

  const li=document.createElement("li");
  const a=document.createElement("a");
  a.href=url;
  a.download=output;
  a.innerText="下载 "+output;
  a.style.color="#60a5fa";
  li.appendChild(a);
  list.appendChild(li);
 }

 document.getElementById("status").innerText="全部转换完成";
}
</script>
</body>
</html>
